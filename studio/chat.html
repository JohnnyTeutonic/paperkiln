<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paperkiln chat</title>
<!-- Served by `mtstudio chat` (embedded in the binary at build time).
     Plain HTML/JS, no build step, no external assets. Talks to the same
     server: GET card, POST chat. -->
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --dim: #6b6b66;
  --line: #e2e2dd; --accent: #2f6fdb; --you: #e8f0fd; --model: #f1f1ee;
  --bad: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #ececea; --dim: #9a9a94;
    --line: #34342f; --accent: #7aa7f5; --you: #22324d; --model: #2a2a27;
    --bad: #f2b8b5;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; max-width: 46rem; margin: 0 auto;
  padding: 0 16px;
}
header { padding: 1rem 0 .5rem; }
h1 { font-size: 1.15rem; margin: 0; }
#card { margin-top: .5rem; padding: .6rem .8rem; border: 1px solid var(--line);
        border-radius: 8px; background: var(--panel); font-size: .9rem; }
#card[hidden] { display: none; }
#card .desc { margin: .25rem 0; }
#card dl { display: grid; grid-template-columns: max-content 1fr; gap: .1rem .8rem;
           margin: .4rem 0 0; color: var(--dim); }
#card dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
#card details { margin-top: .4rem; color: var(--dim); }
#card pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .8rem; }
#log { flex: 1; overflow-y: auto; padding: .5rem 0; }
.msg { margin: .5rem 0; padding: .55rem .8rem; border-radius: 10px;
       max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
.you { background: var(--you); margin-left: auto; }
.model { background: var(--model); }
.err { color: var(--bad); font-size: .9rem; }
.empty { color: var(--dim); text-align: center; margin-top: 2rem; }
form { display: flex; gap: .5rem; padding: .6rem 0 .3rem; }
#msg { flex: 1; min-width: 0; padding: .6rem .7rem; font: inherit; color: var(--ink);
       background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
button { font: inherit; padding: .6rem 1rem; border: 0; border-radius: 8px;
         background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
#controls { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem;
            padding-bottom: 1rem; color: var(--dim); font-size: .85rem; }
#controls label { display: flex; align-items: center; gap: .4rem; }
#clear { background: transparent; color: var(--dim); padding: 0; text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1 id="title">Chat with your model</h1>
  <div id="card" hidden></div>
</header>
<main id="log"><p class="empty" id="empty">Type a message below. This is a small
model trained on your own data: expect short, simple replies.</p></main>
<form id="form" autocomplete="off">
  <input id="msg" placeholder="Say something…" aria-label="Message" required>
  <button id="send" type="submit">Send</button>
</form>
<div id="controls">
  <label>Creativity (temperature)
    <input id="temp" type="range" min="0" max="1.5" step="0.05" value="0.7">
    <output id="tempv">0.70</output></label>
  <label>Reply length
    <input id="len" type="number" min="1" max="256" value="60" style="width:4.5rem"></label>
  <button id="clear" type="button">Clear conversation</button>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const turns = [];   // [{role, content}], sent with each turn
const KEEP = 8;       // turns of context sent back to the model

function add(cls, text) {
  $("empty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

// The model card (tools/model_card.py writes card.json beside the run).
// Its schema belongs to that tool, so show what is there generically:
// a title, a description, and the simple fields; the rest on request.
function showCard(c) {
  if (!c || typeof c !== "object") return;
  const name = c.name || c.model_name || c.title;
  if (name) { $("title").textContent = name; document.title = name + " · chat"; }
  const box = $("card");
  const desc = c.description || c.summary || c.intended_use;
  if (typeof desc === "string") {
    const p = document.createElement("p");
    p.className = "desc";
    p.textContent = desc;
    box.appendChild(p);
  }
  const dl = document.createElement("dl");
  for (const [k, v] of Object.entries(c)) {
    if (["name", "model_name", "title", "description", "summary", "intended_use"].includes(k)) continue;
    if (v === null || typeof v === "object") continue;
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k.replace(/_/g, " ");
    dd.textContent = String(v);
    dl.append(dt, dd);
  }
  if (dl.children.length) box.appendChild(dl);
  const det = document.createElement("details"), sum = document.createElement("summary");
  const pre = document.createElement("pre");
  sum.textContent = "full model card";
  pre.textContent = JSON.stringify(c, null, 2);
  det.append(sum, pre);
  box.appendChild(det);
  box.hidden = false;
}
fetch("card").then(r => r.ok ? r.json() : null).then(showCard).catch(() => {});

$("temp").addEventListener("input", () => {
  $("tempv").textContent = Number($("temp").value).toFixed(2);
});
$("clear").addEventListener("click", () => {
  turns.length = 0;
  $("log").innerHTML = "";
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("msg").value.trim();
  if (!text) return;
  $("msg").value = "";
  add("you", text);
  $("send").disabled = true;
  const pending = add("model", "…");
  try {
    const r = await fetch("chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_input: text,
        temperature: Number($("temp").value),
        max_new_tokens: Math.max(1, Math.min(256, Number($("len").value) || 60)),
        history: turns.slice(-KEEP),
      }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    const reply = j.reply || "(the model ended its turn without words)";
    pending.textContent = reply;
    turns.push({ role: "user", content: text }, { role: "assistant", content: j.reply || "" });
  } catch (err) {
    pending.className = "msg err";
    pending.textContent = "No reply: " + err.message + ". Is mtstudio chat still running?";
  } finally {
    $("send").disabled = false;
    $("msg").focus();
  }
});
$("msg").focus();
</script>
</body>
</html>
