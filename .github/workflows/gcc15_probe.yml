# Temporary diagnostic (branch claude/gcc15-probe only; never merged). Round 5: with the -U__FAST_MATH__ fix
# (paperkiln PR #9) merged in, the whole ctest suite on ubuntu-26.04 (GCC 15) and ubuntu-24.04 (GCC 13), default
# flags as in tests.yml.
name: GCC 15 probe

on:
  push:
    branches: [ claude/gcc15-probe ]

jobs:
  probe:
    name: ${{ matrix.os }} full suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential nlohmann-json3-dev libgtest-dev

      - name: Record the machine and compiler
        run: |
          { echo "## ${{ matrix.os }}"; echo '```'; grep -m1 'model name' /proc/cpuinfo; g++ --version | head -1
            echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17
          cmake --build build -j"$(nproc)"

      - name: libmvec references in the core
        run: echo "_ZGV references - $(nm -u "$(find build -name libtransformer_core.a | head -1)" | grep -c _ZGV || true)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run all tests
        run: |
          cd build
          ctest --output-on-failure 2>&1 | tee ctest.log
          { echo '```'; grep -E "tests passed|tests failed|\*\*\*Failed|Failed  " ctest.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
