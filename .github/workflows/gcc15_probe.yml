# Temporary diagnostic (branch claude/gcc15-probe only; never merged): which of compiler, runner image, CPU
# (-march=native) and the vendored core's -ffast-math separates the five bit-identity tests that fail on
# ubuntu-26.04 / GCC 15.2.
name: GCC 15 probe

on:
  push:
    branches: [ claude/gcc15-probe ]

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 2: every job x86-64-v3 (codegen independent of the runner's CPU); -ffast-math split into parts.
          # core: "drop" removes -ffast-math; otherwise the flags are appended after it (later flags win).
          # Round 4: round 3 showed each of -fmath-errno, -fno-finite-math-only, -fsigned-zeros, -ftrapping-math (the
          # flags that decide whether __FAST_MATH__ is defined) and -fno-tree-vectorize restores the tests. Check
          # for libmvec calls (_ZGV*) directly, and try keeping all fast-math codegen but undefining __FAST_MATH__.
          - { name: v3-fast-math, os: ubuntu-26.04, cxx: g++, extra: "-DMICROTORCH_PORTABLE_ARCH=ON", core: "" }
          - { name: v3-undef-fast-math-macro, os: ubuntu-26.04, cxx: g++, extra: "-DMICROTORCH_PORTABLE_ARCH=ON", core: "-U__FAST_MATH__" }
          - { name: v3-gcc14-fast-math, os: ubuntu-26.04, cxx: g++-14, extra: "-DMICROTORCH_PORTABLE_ARCH=ON", core: "" }
          - { name: native-undef-fast-math-macro, os: ubuntu-26.04, cxx: g++, extra: "", core: "-U__FAST_MATH__" }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential nlohmann-json3-dev libgtest-dev
          if [ "${{ matrix.cxx }}" = g++-14 ]; then sudo apt-get install -y g++-14; fi

      - name: Record the machine and compiler
        run: |
          { echo "## ${{ matrix.name }}"
            echo '```'
            grep -m1 'model name' /proc/cpuinfo
            for f in avx2 fma avx512f avx512vl avx512_fp16 amx_tile; do
              grep -qw "$f" /proc/cpuinfo && echo "has $f" || echo "no  $f"; done
            ${{ matrix.cxx }} --version | head -1
            echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          ${{ matrix.cxx }} -march=native -Q --help=target 2>/dev/null | grep -E '^\s+-march=|-mtune=' | head -2

      - name: Adjust the core's -ffast-math (this job only)
        if: matrix.core != ''
        run: |
          f=third_party/transformer_cpp/CMakeLists.txt
          if [ "${{ matrix.core }}" = drop ]; then sed -i '/-ffast-math/d' "$f"
          else sed -i 's/-ffast-math /-ffast-math ${{ matrix.core }} /' "$f"; fi
          grep -n -A1 -B3 'O3 ' "$f" | head -12

      - name: Build the five tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
          cmake --build build -j"$(nproc)" --target test_step_residency test_fused_head test_llama_attnres \
            test_recursion test_mor

      - name: Vector math library calls in the core
        run: |
          lib=$(find build -name 'libtransformer_core.a' | head -1)
          { echo '```'; echo "libmvec symbols referenced by $lib:"
            nm -u "$lib" 2>/dev/null | grep -o '_ZGV[A-Za-z0-9_]*' | sort | uniq -c | sort -rn | head -20
            echo "objects referencing _ZGV: $(nm -A -u "$lib" 2>/dev/null | grep '_ZGV' | cut -d: -f2 | sort -u | tr '\n' ' ')"
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the five tests
        run: |
          mkdir -p logs
          { echo '```'
            for t in step_residency fused_head llama_attnres recursion mor; do
              if ./build/test_$t > logs/$t.log 2>&1; then echo "PASS $t"; else echo "FAIL $t (exit $?)"; fi
            done
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          for t in step_residency fused_head llama_attnres recursion mor; do
            echo "=== $t"; grep -n -i -E 'fail|mismatch|differ|expected|!=' logs/$t.log | head -15
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: logs/
