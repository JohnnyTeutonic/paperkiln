name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            nlohmann-json3-dev \
            libgtest-dev

      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: Build
        run: cd build && make -j$(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure -V

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/

  create-release:
    name: Create GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Create source archive
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          tar -czf paperkiln-${VERSION}.tar.gz \
            --exclude=build \
            --exclude=.git \
            --exclude=.env \
            --exclude=models \
            .
          sha256sum paperkiln-${VERSION}.tar.gz > paperkiln-${VERSION}.tar.gz.sha256
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cat > release_notes.md << 'EOF'
          # paperkiln $VERSION

          Changes: see CHANGELOG.md. Building, the chat quickstart and the studio: see README.md.
          Open work: see ROADMAP.md.

          ## From source
          ```bash
          mkdir paperkiln-$VERSION && tar xzf paperkiln-$VERSION.tar.gz -C paperkiln-$VERSION
          cd paperkiln-$VERSION && mkdir build && cd build
          cmake .. && make -j4 && ctest
          ```

          ## Verify the archive
          ```bash
          sha256sum -c paperkiln-$VERSION.tar.gz.sha256
          ```

          ## Contributors
          - Jonathan Reich (@JohnnyTeutonic)
          - Claude Haiku 4.5 (Anthropic)
          EOF
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            paperkiln-${{ env.VERSION }}.tar.gz
            paperkiln-${{ env.VERSION }}.tar.gz.sha256
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  benchmark-release:
    name: Benchmark Release Build
    needs: build-and-test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            nlohmann-json3-dev

      - name: Build benchmarks
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make benchmark_attention benchmark_mamba phase3_integration -j$(nproc)

      - name: Run benchmarks
        run: |
          cd build
          echo "## Attention Benchmark" > ../benchmarks.md
          ./benchmark_attention 2>&1 | tee -a ../benchmarks.md
          echo "" >> ../benchmarks.md
          echo "## Mamba vs Kimi Benchmark" >> ../benchmarks.md
          ./benchmark_mamba 2>&1 | tee -a ../benchmarks.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmarks
          path: benchmarks.md

      - name: Comment on release with benchmarks
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const benchmarks = fs.readFileSync('benchmarks.md', 'utf8');
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            if (releases.data.length > 0) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releases.data[0].id,
                body: releases.data[0].body + '\n\n## Release Benchmarks\n' + benchmarks
              });
            }
