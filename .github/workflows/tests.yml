name: GTest Suite

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  CMAKE_BUILD_TYPE: Release
  CXX_STANDARD: 17

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            nlohmann-json3-dev \
            libgtest-dev

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }}

      - name: Build
        run: cd build && make -j$(nproc)

      - name: Run all tests
        run: |
          cd build
          ctest --output-on-failure -V

      - name: Run gradient checks
        run: cd build && ./test_gradcheck

      - name: Run benchmark tests
        run: cd build && ./phase3_integration

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tests (extractor, chat server, RoPE heads, model card)
        run: |
          python3 -m pip install --quiet pytest
          MTSTUDIO_BIN=build/mtstudio python3 -m pytest -q \
            papers/test_fetch.py tests/test_mtstudio_chat.py \
            tests/test_rope_heads.py tools/test_model_card.py

      - name: paperkiln-fetch matches papers/fetch.py
        run: python3 tools/sync_fetch_pkg.py --check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            nlohmann-json3-dev \
            libgtest-dev \
            lcov

      - name: Configure with coverage
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fno-inline -fno-inline-small-functions"

      - name: Build
        run: cd build && make -j$(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure

      - name: Generate coverage report
        run: |
          cd build
          lcov --directory . --capture --output-file coverage.info \
            --ignore-errors mismatch,inconsistent,unused
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/third_party/*' \
            --output-file coverage.info \
            --ignore-errors mismatch,inconsistent,unused
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./build/coverage.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-tidy cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            include/ src/ tests/ tools/ \
            --report-progress || true

      - name: Run clang-tidy
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          clang-tidy -p=. ../src/*.cpp ../tests/*.cpp || true

  valgrind:
    name: Memory Safety (Valgrind)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            nlohmann-json3-dev \
            libgtest-dev \
            valgrind

      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug
          make -j$(nproc)

      - name: Run with Valgrind
        run: |
          cd build
          valgrind --leak-check=full --show-leak-kinds=all \
            --track-origins=yes --verbose \
            ./test_gradcheck 2>&1 | tee valgrind.log
        continue-on-error: true

      - name: Upload Valgrind report
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-report
          path: build/valgrind.log
