name: Performance Benchmarks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            nlohmann-json3-dev

      - name: Test benchmark environment contracts
        run: python3 -m unittest discover -s tests -p test_benchmark_environment.py -v

      - name: Build benchmarks
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
          make benchmark_attention benchmark_mamba phase3_integration -j$(nproc)

      - name: Record benchmark execution environment
        id: benchmark_env
        run: |
          python3 .github/scripts/benchmark_environment.py --build build \
            --out build/benchmark-environment.json --github-output "$GITHUB_OUTPUT"

      - name: Run attention benchmark
        id: attention_bench
        run: |
          cd build
          ./benchmark_attention > attention_benchmark.txt 2>&1
          cat attention_benchmark.txt

      - name: Run mamba benchmark
        id: mamba_bench
        run: |
          cd build
          ./benchmark_mamba > mamba_benchmark.txt 2>&1
          cat mamba_benchmark.txt

      - name: Run integration benchmark
        id: integration_bench
        run: |
          cd build
          ./phase3_integration > integration_benchmark.txt 2>&1
          cat integration_benchmark.txt

      - name: Parse benchmark results
        id: parse_results
        run: |
          python3 << 'EOF'
          import re

          results = {}

          # Parse attention benchmark
          with open('build/attention_benchmark.txt', 'r') as f:
              content = f.read()
              speedups = re.findall(r'Speedup[:\s]+([0-9.]+)x', content)
              if speedups:
                  results['attention_speedup'] = float(speedups[0])

          # Parse mamba benchmark
          with open('build/mamba_benchmark.txt', 'r') as f:
              content = f.read()
              if 'Total:' in content:
                  results['mamba_tested'] = True

          print(f"RESULTS={results}")
          EOF

      - name: Convert results to JSON
        run: |
          python3 .github/scripts/bench_to_json.py build/attention_benchmark.txt \
            build/mamba_benchmark.txt > build/benchmark.json
          cat build/benchmark.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            build/attention_benchmark.txt
            build/mamba_benchmark.txt
            build/integration_benchmark.txt
            build/benchmark.json
            build/benchmark-environment.json

      # The previous master results live in the Actions cache (gh-pages serves the docs).
      - name: Restore previous master results
        uses: actions/cache/restore@v4
        with:
          path: bench-cache
          key: benchmark-data-v2-${{ steps.benchmark_env.outputs.cohort }}-${{ github.run_id }}
          restore-keys: benchmark-data-v2-${{ steps.benchmark_env.outputs.cohort }}-

      - name: Verify baseline environment before comparing
        run: |
          python3 .github/scripts/benchmark_environment.py \
            --out build/benchmark-environment.json --validate-cache bench-cache

      # Shared runners are noisy: fail only when a measurement is 2.5x the stored value.
      - name: Compare with previous master results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: build/benchmark.json
          external-data-json-path: bench-cache/benchmark-data.json
          alert-threshold: '250%'
          fail-on-alert: true
          summary-always: true
          save-data-file: ${{ github.event_name != 'pull_request' }}

      - name: Save master results
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: bench-cache
          key: benchmark-data-v2-${{ steps.benchmark_env.outputs.cohort }}-${{ github.run_id }}

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const attention = fs.readFileSync('build/attention_benchmark.txt', 'utf8');
            const mamba = fs.readFileSync('build/mamba_benchmark.txt', 'utf8');

            const comment = `## 📊 Performance Benchmarks

            ### Attention Benchmark
            \`\`\`
            ${attention.slice(0, 1000)}
            \`\`\`

            ### Mamba Benchmark
            \`\`\`
            ${mamba.slice(0, 1000)}
            \`\`\`

            Full results available in [artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
