name: Wheels (macOS, Windows)

# Builds the macOS and Windows wheels with cibuildwheel and keeps them as workflow artifacts.
# Nothing here publishes: no PyPI upload, no release. Runs on a push to the `wheels` branch
# (LOCAL_LLM_STACK.md section 11 item 6) or by hand; the Linux wheels stay in wheels.yml.

on:
  push:
    branches: [ wheels ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: the vendored core includes <omp.h> and Apple clang has no OpenMP, so Homebrew's
          # libomp is installed and found through OpenMP_ROOT; delocate copies it into the wheel, so
          # the deployment target is the runner's macOS (Homebrew builds libomp for it).
          - os: macos-14          # Apple silicon (M1: -march=native is the oldest Apple core)
            archs: arm64
            target: "14.0"
          - os: macos-15-intel    # Intel; pyproject's -march becomes x86-64-v3 (CMakeLists.txt)
            archs: x86_64
            target: "15.0"
          - os: windows-latest    # x64 (win32 is skipped in pyproject.toml)
            archs: AMD64
            target: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_ALL_MACOS: brew install libomp
          CIBW_ENVIRONMENT_MACOS: OpenMP_ROOT=$(brew --prefix libomp) MACOSX_DEPLOYMENT_TARGET=${{ matrix.target }}

      # A failed build's log is readable only when signed in; its first compiler errors and its tail are
      # also written as annotations, which the public API serves to anyone.
      - name: Report the build failure as annotations
        if: failure()
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          if [ "$RUNNER_OS" = "macOS" ]; then brew install libomp > /dev/null 2>&1 || true
            export OpenMP_ROOT=$(brew --prefix libomp) MACOSX_DEPLOYMENT_TARGET=${{ matrix.target }}; fi
          "$PY" -m pip wheel . --no-deps -v > build.log 2>&1 || true
          { grep -n -i -E "error|fatal" build.log | head -40; echo "----- tail -----"; tail -40 build.log; } > report.txt
          split -l 20 report.txt part_
          for f in part_*; do echo "::error title=build ${{ matrix.os }} ${f}::$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')"; done

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl
          if-no-files-found: error
