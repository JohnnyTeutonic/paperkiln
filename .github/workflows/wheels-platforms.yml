name: Wheels (macOS, Windows)

# Builds the macOS and Windows wheels with cibuildwheel and keeps them as workflow artifacts.
# Nothing here publishes: no PyPI upload, no release. Runs on a push to the `wheels` branch
# (LOCAL_LLM_STACK.md section 11 item 6) or by hand; the Linux wheels stay in wheels.yml.

on:
  push:
    branches: [ wheels ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple silicon, arm64
            archs: arm64
          - os: macos-13        # Intel, x86_64
            archs: x86_64
          - os: windows-latest  # x64 (win32 is skipped in pyproject.toml)
            archs: AMD64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD_VERBOSITY: 1
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.archs == 'arm64' && '11.0' || '10.15' }}

      # A failed build's log is readable only when signed in; its first compiler errors and its tail are
      # also written as annotations, which the public API serves to anyone.
      - name: Report the build failure as annotations
        if: failure()
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" -m pip wheel . --no-deps -v > build.log 2>&1 || true
          { grep -n -i -E "error|fatal" build.log | head -40; echo "----- tail -----"; tail -40 build.log; } > report.txt
          split -l 20 report.txt part_
          for f in part_*; do echo "::error title=build ${{ matrix.os }} ${f}::$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')"; done

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl
          if-no-files-found: error
