# pip install . builds the C++ extension via scikit-build-core + CMake.
# The distribution is paperkiln; the import names stay microtorch/_microtorch.
# The PyPI name is not yet claimed.
# Nothing here publishes — the wheels workflow builds artifacts only.
[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "paperkiln"
version = "0.3.0"
description = "Paste an arXiv ID, get a model you can chat with — a readable C++ LLM training stack with provenance-carrying paper extraction"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jonathan Reich" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/JohnnyTeutonic/paperkiln"

[tool.scikit-build]
cmake.args = ["-DMICROTORCH_BUILD_PYTHON=ON", "-DCMAKE_BUILD_TYPE=Release"]
wheel.packages = ["python/microtorch"]
build.targets = ["_microtorch"]

[tool.cibuildwheel]
test-requires = ["numpy"]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux* *-win32 *-manylinux_i686"
test-command = "python -c \"import _microtorch as mt; import numpy as np; x = mt.tensor(np.ones((2,3), dtype=np.float32), requires_grad=True); mt.backward(mt.ops.mean(x)); assert x.grad.shape == (2,3); print('wheel smoke OK')\""
